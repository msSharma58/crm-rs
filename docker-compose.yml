services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: homora-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_DATABASE: homora_crm
      DB_USERNAME: homora
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
    depends_on:
      - mysql
      - redis
    networks:
      - homora

  nginx:
    image: nginx:1.27-alpine
    container_name: homora-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - homora

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: homora-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: mysql
      DB_DATABASE: homora_crm
      DB_USERNAME: homora
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - app
      - redis
      - mysql
    networks:
      - homora

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: homora-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: mysql
      DB_DATABASE: homora_crm
      DB_USERNAME: homora
      DB_PASSWORD: secret
      REDIS_HOST: redis
    depends_on:
      - app
      - mysql
      - redis
    networks:
      - homora

  mysql:
    image: mysql:8.0
    container_name: homora-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: homora_crm
      MYSQL_USER: homora
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - homora_mysql:/var/lib/mysql
    networks:
      - homora

  redis:
    image: redis:7-alpine
    container_name: homora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - homora

networks:
  homora:
    driver: bridge

volumes:
  homora_mysql:
